# =============================================================================
# jerry-ai-app 生产 Nginx 配置（挂在 /etc/nginx/conf.d/default.conf）
#
# 职责：
#   1. 反代 NestJS（app:3000）：含 SSE 聊天流与 WebSocket 语音通道
#   2. /download/ 提供桌面安装包下载
#   3. 预留 ACME 验证与 443 HTTPS（证书就位后按文末说明启用）
#
# 关键参数说明：
#   - proxy_buffering off        → SSE 必关，否则聊天流式输出会被缓冲成大块
#   - proxy_read_timeout 3600s   → SSE/WS 长连接不被 60s 默认超时掐断
#   - client_max_body_size 50m   → 对齐后端 express.json 50mb 上传上限
#   - HTTP/1.1 + Upgrade 头      → WebSocket (/api/speech/stream) 必需
# =============================================================================

# WebSocket 升级连接头映射
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

upstream jerry_app {
    server app:3000;
    keepalive 32;
}

# ------------------------------- HTTP (80) -------------------------------
server {
    listen 80;
    server_name _;

    # 上传大小与后端 50mb JSON 限制对齐
    client_max_body_size 50m;

    # Let's Encrypt http-01 验证（certbot certonly --webroot 时使用）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 安装包下载目录：把 exe/dmg 放入 docker/data/download/
    location /download/ {
        alias /var/www/download/;
        autoindex on;              # 简易文件列表即下载页；上架正式下载页后可关闭
        add_header Cache-Control "no-cache";
    }

    # 其余全部反代后端
    location / {
        proxy_pass http://jerry_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # ---- SSE 关键参数 ----
        proxy_buffering off;
        proxy_cache off;
        # gzip 会等待缓冲攒批，破坏 SSE 逐字输出，明确关闭
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

