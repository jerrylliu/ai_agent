# =============================================================================
# jerry-ai-app 生产 Nginx 配置（挂在 /etc/nginx/conf.d/default.conf）
#
# 职责：
#   1. 反代 NestJS（app:3000）：含 SSE 聊天流与 WebSocket 语音通道
#   2. /download/ 提供桌面安装包下载
#   3. HTTPS 443（Let's Encrypt 证书，certbot webroot 方式签发与续期）
#
# 端口分流设计（重要）：
#   - 80 默认 server（IP 直连）：继续反代后端——已发行客户端写死的
#     http://124.223.169.223 必须保持可用，不能 301 到 HTTPS（IP 无证书）
#   - 80 域名 server：301 整站跳转 HTTPS（浏览器访问域名走加密通道）
#   - 443 server：域名正式入口，证书域名 xn--5-fs8a810ixgul5n.online
#
# 关键参数说明：
#   - proxy_buffering off        → SSE 必关，否则聊天流式输出会被缓冲成大块
#   - proxy_read_timeout 3600s   → SSE/WS 长连接不被 60s 默认超时掐断
#   - client_max_body_size 50m   → 对齐后端 express.json 50mb 上传上限
#   - HTTP/1.1 + Upgrade 头      → WebSocket (/api/speech/stream) 必需
#   - ACME 验证路径在两个 80 server 均保留 → certbot webroot 续期可用
# =============================================================================

# WebSocket 升级连接头映射
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

upstream jerry_app {
    server app:3000;
    keepalive 32;
}

# ----------------- HTTP (80) 默认 server：IP 直连兼容 -----------------
# 已发行客户端写死 http://124.223.169.223，此 server 保证它们继续可用
server {
    listen 80 default_server;
    server_name _;

    # 上传大小与后端 50mb JSON 限制对齐
    client_max_body_size 50m;

    # Let's Encrypt http-01 验证（certbot webroot 续期时使用）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 安装包下载目录：把 exe/dmg 放入 docker/data/download/
    location /download/ {
        alias /var/www/download/;
        autoindex on;              # 简易文件列表即下载页；上架正式下载页后可关闭
        add_header Cache-Control "no-cache";
    }

    # 其余全部反代后端
    location / {
        proxy_pass http://jerry_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # ---- SSE 关键参数 ----
        proxy_buffering off;
        proxy_cache off;
        # gzip 会等待缓冲攒批，破坏 SSE 逐字输出，明确关闭
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# ----------------- HTTP (80) 域名 server：301 跳 HTTPS -----------------
# 浏览器用域名访问时引导到 HTTPS；ACME 路径保留供 certbot 续期
server {
    listen 80;
    server_name xn--5-fs8a810ixgul5n.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------- HTTPS (443)：域名正式入口 -----------------
# 证书：Let's Encrypt（certbot webroot 签发，到期 2026-12-10，自动续期）
# 注意：证书仅含 xn--5-fs8a810ixgul5n.online，www 子域需扩展证书后才可用
server {
    listen 443 ssl;
    http2 on;
    server_name xn--5-fs8a810ixgul5n.online;

    ssl_certificate     /etc/nginx/certs/live/xn--5-fs8a810ixgul5n.online/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/xn--5-fs8a810ixgul5n.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50m;

    # 安装包下载目录（HTTPS 入口）
    location /download/ {
        alias /var/www/download/;
        autoindex on;
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://jerry_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # ---- SSE 关键参数（与 80 server 保持一致）----
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
