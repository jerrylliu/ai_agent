# =============================================================================
# 生产部署编排（应用 + MySQL + Redis + ChromaDB + Nginx）
#
# 与 docker-compose.dev.yml 的区别：
#   - 应用本身进容器（本文件构建镜像），dev 版只编排依赖
#   - MySQL / Redis / Chroma 不暴露任何公网端口，仅 nginx 发布 80/443
#   - 启用 Redis（REDIS_ENABLED=true）+ 密码；全部服务带健康检查与自动重启
#
# 使用方式（在 docker/ 目录下执行）：
#   cd servers/jerry-llm-server/docker
#   docker compose -f docker-compose.prod.yml --env-file ../.env up -d --build
#
# 前置步骤：
#   1. cp .env.example .env（在 servers/jerry-llm-server/ 下）并完成【生产必改】项
#   2. 数据库结构：首次启动前执行迁移
#      docker compose -f docker-compose.prod.yml --env-file ../.env run --rm app \
#        node dist/src/typeorm-data-source.js migration:run   # 见文件末尾说明
#   3. HTTPS 证书就位后取消 nginx 443 段注释（见 nginx/nginx.conf 内说明）
#
# 密钥安全：.env 只存在于服务器磁盘，通过 --env-file 注入 compose 变量、
# env_file 注入应用容器，任何镜像层都不包含机密。
# =============================================================================

services:
  # ==================== NestJS 后端 ====================
  app:
    build:
      # 上下文必须是 monorepo 根（pnpm-lock.yaml / .dockerignore 均在根目录）
      # 本文件位于 servers/jerry-llm-server/docker/ 下，上跳三级才是仓库根
      context: ../../..
      dockerfile: servers/jerry-llm-server/Dockerfile
    image: jerry-llm-server:latest
    container_name: jerry-app
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # 容器网络覆盖：.env 中的 localhost 地址在此强制替换为服务名
      # （environment 优先级高于 env_file，无需手工维护两份 .env）
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CHROMA_URL: http://chroma:8000
      # 生产强制关闭表结构自动同步，一律走迁移
      TYPEORM_SYNCHRONIZE: "false"
    volumes:
      # 持久化运行时数据（宿主机目录见 docker/data/）
      - ./data/uploads:/app/servers/jerry-llm-server/uploads
      - ./data/storage:/app/servers/jerry-llm-server/storage
      - ./data/tmp:/app/servers/jerry-llm-server/tmp
      - ./data/logs:/app/servers/jerry-llm-server/logs
      # 嵌入模型等前端设置持久化。首次部署前在宿主机准备空 JSON：
      #   echo '{}' > data/runtime-config.json
      # 之后在设置界面配置云端嵌入会写回该文件
      - ./data/runtime-config.json:/app/servers/jerry-llm-server/runtime-config.json
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
    networks:
      - backend

  # ==================== MySQL 8（不暴露公网） ====================
  mysql:
    image: mysql:8.0
    container_name: jerry-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  # ==================== Redis 7（不暴露公网，强制密码） ====================
  redis:
    image: redis:7-alpine
    container_name: jerry-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - backend

  # ==================== ChromaDB（不暴露公网） ====================
  # 注意：chromadb/chroma:latest(v1.5.7) 官方镜像构建缺 curl 和 python（上游 bug
  # chroma-core/chroma#6855，修复 PR #6856 未合并），健康检查只能用镜像自带的
  # apt-helper（下载成功=退出码 0，失败=非 0，等价于 curl -f）；数据目录默认 /data
  chroma:
    image: chromadb/chroma:latest
    container_name: jerry-chroma
    restart: unless-stopped
    environment:
      CHROMA_ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma-data:/data
    healthcheck:
      test: ["CMD-SHELL", "/usr/lib/apt/apt-helper download-file http://localhost:8000/api/v2/heartbeat /tmp/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend

  # ==================== Nginx（唯一对外入口） ====================
  nginx:
    image: nginx:alpine
    container_name: jerry-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # HTTPS 证书（certbot 申请后放入；未启用 HTTPS 前保持目录存在即可）
      - ./nginx/certs:/etc/nginx/certs:ro
      # ACME http-01 验证目录
      - ./data/certbot:/var/www/certbot:ro
      # 安装包下载目录：把 exe/dmg 放到 docker/data/download/ 即可通过 /download/ 访问
      - ./data/download:/var/www/download:ro
    depends_on:
      - app
    networks:
      - backend
      - public

networks:
  backend:
    driver: bridge
    # internal: true 会彻底禁止出网，但 app 需要访问 DashScope/硅基流动等云端 API，
    # 因此 backend 保持可出网；安全性由「不映射公网端口」保证
  public: {}

volumes:
  mysql-data:
  redis-data:
  chroma-data:

# =============================================================================
# 数据库迁移说明（TYPEORM_SYNCHRONIZE=false 后表结构唯一来源是迁移文件）
#
# 首次部署 / 拉取新代码镜像后执行（容器内 prod 依赖已含 typeorm CLI）：
#   docker exec -it jerry-app sh -c "cd /app/servers/jerry-llm-server && \
#     node node_modules/typeorm/cli.js -d dist/src/typeorm-data-source.js migration:run"
# =============================================================================
