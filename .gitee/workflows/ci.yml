# 2. 定义流水线 YAML 内容
version: "1.0"
name: tauri-nestjs-build
displayName: Tauri与NestJS构建流水线
triggers:
  push:
    branches:
      - master
      - main

stages:
  - stage:
      name: build_stage
      displayName: 环境准备与构建阶段
      jobs:
        job:
          name: build_job
          displayName: 全流程构建任务
          runsOn: ubuntu-latest
          steps:
            - step: shell
              name: install_node
              displayName: 安装 Node.js 18
              commands:
                - curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
                - sudo apt-get install -y nodejs
                - corepack enable
                - corepack prepare pnpm@latest --activate
            - step: shell
              name: install_deps
              displayName: 安装依赖 (pnpm)
              commands:
                - pnpm install --frozen-lockfile
            - step: shell
              name: build_nestjs
              displayName: 构建 NestJS 后端
              commands:
                - pnpm run build:server
            - step: shell
              name: build_tauri
              displayName: 构建 Tauri 前端及打包
              commands:
                - sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.0-dev build-essential curl wget libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
                - pnpm run tauri build
