# .gitee/workflows/ci.yml
stages:
  - prepare
  - build

# 全局超时设置（解决Tauri构建超时问题）
options:
  timeout: 30  # 单位：分钟（个人版免费额度内合理使用）

# 全局缓存配置（关键优化点）
cache:
  key: $CI_COMMIT_REF_NAME  # 按分支缓存，避免不同分支污染
  paths:
    - node_modules/         # 缓存依赖，加速后续构建

# 阶段1：安装所有依赖
prepare_job:
  stage: prepare
  script:
    - corepack enable  # 启用pnpm（Node.js内置）
    - pnpm config set registry https://registry.npmmirror.com  # 强制使用国内镜像
    - pnpm install --frozen-lockfile  # 禁止自动更新lockfile

# 阶段2：构建Tauri桌面应用（前端）
build_frontend_job:
  stage: build
  script:
    - export PATH="$PATH:$(pwd)/node_modules/.bin"  # 修复pnpm命令路径
    - cd clients/jerry-ai-app
    - pnpm run build
    - pnpm run tauri build --no-confirm  # 关键：跳过交互确认
  artifacts:
    paths:
      - clients/jerry-ai-app/src-tauri/target/release/  # 保存Tauri构建产物

# 阶段3：构建NestJS后端服务
build_backend_job:
  stage: build
  script:
    - cd servers/jerry-llm-server
    - pnpm run build
  artifacts:
    paths:
      - servers/jerry-llm-server/dist/

# 触发条件设置（仅当代码变更时触发）
triggers:
  push:
    paths:
      - clients/**/*    # 仅客户端代码变更时触发
      - servers/**/*    # 仅服务端代码变更时触发
    branches:
      - main          # 仅监听main分支