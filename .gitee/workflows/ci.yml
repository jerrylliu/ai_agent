# .gitee/workflows/ci.yml
stages:
  - prepare
  - build

# 全局超时设置（避免Tauri构建超时）
options:
  timeout: 30

# 修复1：必须在根目录安装依赖（monorepo关键）
prepare_job:
  stage: prepare
  script:
    - corepack enable
    - pnpm config set registry https://registry.npmmirror.com
    # 关键：在根目录执行安装（不是子目录！）
    - pnpm install --frozen-lockfile
  cache:
    key: $CI_COMMIT_REF_NAME
    paths:
      - node_modules/  # 缓存根目录依赖

# 修复2：分阶段构建（确保工作目录正确）
build_frontend_job:
  stage: build
  script:
    # 关键：先回到根目录，再进入客户端
    - cd clients/jerry-ai-app
    - pnpm run build
    - pnpm run tauri build --no-confirm
  artifacts:
    paths:
      - clients/jerry-ai-app/src-tauri/target/release/

build_backend_job:
  stage: build
  script:
    # 关键：先回到根目录，再进入服务端
    - cd servers/jerry-llm-server
    - pnpm run build
  artifacts:
    paths:
      - servers/jerry-llm-server/dist/