version: '1.0'
name: dev-ci
displayName: 开发期门禁
triggers:
  trigger: auto
  push:
    branches:
      prefix:
        - ''
stages:
  - name: stage-16fcc43d
    displayName: 代码检查
    strategy: naturally
    trigger: auto
    steps:
      - step: build@nodejs
        name: build_nodejs
        displayName: Nodejs 构建
        nodeVersion: 25.4.0
        commands:
          - set -e
          - echo "=== 开始构建 ==="
          - ''
          - '# 1. 执行构建命令'
          - pnpm build
          - ''
          - '# 2. 检查构建产物是否存在（防止报错退出）'
          - if [ -d "./dist" ]; then
          - '  echo "✅ 构建成功，产物在 ./dist 目录"'
          - else
          - '  echo "⚠️ 未找到 ./dist 目录，尝试查找其他目录..."'
          - '  # 如果 dist 不存在，试着找找看是不是生成在其他地方了（比如 build）'
          - '  ls -la'
          - '  exit 1'
          - fi
          - ''
          - echo "✅ CI 全流程完成"
        artifacts:
          - name: BUILD_ARTIFACT
            path:
              - ./dist
        caches:
          - ~/.npm
          - ~/.yarn
        notify: []
        strategy:
          retry: '0'
