version: '1.0'
name: dev-ci
displayName: 开发期门禁
triggers:
  trigger: auto
  push:
    branches:
      prefix:
        - ''
stages:
  - name: stage-16fcc43d
    displayName: 代码检查
    strategy: naturally
    trigger: auto
    steps:
      - step: build@nodejs
        name: build_nodejs
        displayName: Nodejs 构建
        nodeVersion: 25.4.0
        commands:
          - set -e
          - echo "=== 当前目录 ==="
          - pwd
          - ''
          - echo "=== 目录结构 ==="
          - ls -la
          - ''
          - echo "=== package.json scripts ==="
          - cat package.json | grep -A 20 '"scripts"' || echo "❌ 没找到 package.json"
          - ''
          - echo "=== pnpm workspaces ==="
          - cat pnpm-workspace.yaml 2>/dev/null || echo "❌ 非 workspace 项目"
        artifacts:
          - name: BUILD_ARTIFACT
            path:
              - ./dist
        caches:
          - ~/.npm
          - ~/.yarn
        notify: []
        strategy:
          retry: '0'
